name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: wordly:smoketest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          set -e
          docker run -d --name wordly-smoketest -p 8080:80 wordly:smoketest
          echo "Waiting for server to come up..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "Server is up"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "Server never became healthy"
              docker logs wordly-smoketest
              exit 1
            fi
            sleep 1
          done

          echo "Checking static frontend is served..."
          curl -sf http://localhost:8080/ | grep -q "WORDLY" || (echo "index.html missing expected content" && exit 1)

          echo "Submitting a test score with time and luck..."
          RESPONSE=$(curl -sf -X POST http://localhost:8080/api/score \
            -H "Content-Type: application/json" \
            -d '{"name":"ci-smoke-test","length":5,"date":"2020-01-01","won":true,"guesses":3,"timeMs":45000,"luck":72}')
          echo "$RESPONSE" | grep -q '"name":"ci-smoke-test"' || (echo "score submission response unexpected: $RESPONSE" && exit 1)
          echo "$RESPONSE" | grep -q '"timeMs":45000' || (echo "score submission missing timeMs: $RESPONSE" && exit 1)
          echo "$RESPONSE" | grep -q '"luck":72' || (echo "score submission missing luck: $RESPONSE" && exit 1)

          echo "Fetching leaderboard..."
          LB=$(curl -sf "http://localhost:8080/api/leaderboard?length=5")
          echo "$LB" | grep -q 'ci-smoke-test' || (echo "leaderboard missing submitted score: $LB" && exit 1)
          echo "$LB" | grep -q '"bestTimeMs":45000' || (echo "leaderboard missing bestTimeMs: $LB" && exit 1)
          echo "$LB" | grep -q '"avgLuck":72' || (echo "leaderboard missing avgLuck: $LB" && exit 1)

          echo "Smoke test passed"
          docker stop wordly-smoketest
          docker rm wordly-smoketest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
