<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131417"/>
      <stop offset="55%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1a2418" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="mid" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="tight" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#wall)"/>
  <rect width="1080" height="1920" fill="url(#ambient)"/>

  <!-- faint brick coursing -->
  <g stroke="#1c1e24" stroke-width="2" opacity="0.4">
    <line x1="0" y1="180" x2="1080" y2="180"/>
    <line x1="0" y1="360" x2="1080" y2="360"/>
    <line x1="0" y1="540" x2="1080" y2="540"/>
    <line x1="0" y1="720" x2="1080" y2="720"/>
    <line x1="0" y1="900" x2="1080" y2="900"/>
    <line x1="0" y1="1080" x2="1080" y2="1080"/>
    <line x1="0" y1="1260" x2="1080" y2="1260"/>
    <line x1="0" y1="1440" x2="1080" y2="1440"/>
    <line x1="0" y1="1620" x2="1080" y2="1620"/>
    <line x1="0" y1="1800" x2="1080" y2="1800"/>
  </g>

  <!-- ===== neon sign cluster, three-layer tube glow ===== -->
  <g>
    <!-- large ring, green -->
    <circle cx="330" cy="720" r="170" fill="none" stroke="#39ff14" stroke-width="34" opacity="0.5" filter="url(#soft)"/>
    <circle cx="330" cy="720" r="170" fill="none" stroke="#39ff14" stroke-width="14" opacity="0.75" filter="url(#mid)"/>
    <circle cx="330" cy="720" r="170" fill="none" stroke="#c9ffb0" stroke-width="5" filter="url(#tight)"/>

    <!-- triangle, magenta -->
    <path d="M 620 560 L 900 940 L 340 940 Z" fill="none" stroke="#ff2ec4" stroke-width="30" opacity="0.45" filter="url(#soft)" stroke-linejoin="round"/>
    <path d="M 620 560 L 900 940 L 340 940 Z" fill="none" stroke="#ff2ec4" stroke-width="12" opacity="0.7" filter="url(#mid)" stroke-linejoin="round"/>
    <path d="M 620 560 L 900 940 L 340 940 Z" fill="none" stroke="#ffd6f5" stroke-width="4" filter="url(#tight)" stroke-linejoin="round"/>

    <!-- small ring, cyan, overlapping -->
    <circle cx="760" cy="700" r="100" fill="none" stroke="#22e0ff" stroke-width="28" opacity="0.45" filter="url(#soft)"/>
    <circle cx="760" cy="700" r="100" fill="none" stroke="#22e0ff" stroke-width="11" opacity="0.7" filter="url(#mid)"/>
    <circle cx="760" cy="700" r="100" fill="none" stroke="#cdf7ff" stroke-width="4" filter="url(#tight)"/>

    <!-- zigzag bolt, yellow -->
    <path d="M 200 1040 L 320 1040 L 260 1160 L 400 1160 L 220 1420 L 270 1200 L 150 1200 Z"
          fill="none" stroke="#ffe600" stroke-width="26" opacity="0.5" filter="url(#soft)" stroke-linejoin="round"/>
    <path d="M 200 1040 L 320 1040 L 260 1160 L 400 1160 L 220 1420 L 270 1200 L 150 1200 Z"
          fill="none" stroke="#ffe600" stroke-width="10" opacity="0.75" filter="url(#mid)" stroke-linejoin="round"/>
    <path d="M 200 1040 L 320 1040 L 260 1160 L 400 1160 L 220 1420 L 270 1200 L 150 1200 Z"
          fill="none" stroke="#fff8c2" stroke-width="4" filter="url(#tight)" stroke-linejoin="round"/>

    <!-- lower triangle, green, downward -->
    <path d="M 780 1180 L 980 1500 L 580 1500 Z" fill="none" stroke="#39ff14" stroke-width="26" opacity="0.4" filter="url(#soft)" stroke-linejoin="round"/>
    <path d="M 780 1180 L 980 1500 L 580 1500 Z" fill="none" stroke="#39ff14" stroke-width="10" opacity="0.65" filter="url(#mid)" stroke-linejoin="round"/>
    <path d="M 780 1180 L 980 1500 L 580 1500 Z" fill="none" stroke="#c9ffb0" stroke-width="4" filter="url(#tight)" stroke-linejoin="round"/>

    <!-- small accent ring bottom-left, cyan -->
    <circle cx="220" cy="1620" r="80" fill="none" stroke="#22e0ff" stroke-width="22" opacity="0.4" filter="url(#soft)"/>
    <circle cx="220" cy="1620" r="80" fill="none" stroke="#22e0ff" stroke-width="9" opacity="0.65" filter="url(#mid)"/>
    <circle cx="220" cy="1620" r="80" fill="none" stroke="#cdf7ff" stroke-width="3" filter="url(#tight)"/>
  </g>

  <!-- floor glow reflection -->
  <rect x="0" y="1860" width="1080" height="60" fill="#39ff14" opacity="0.12" filter="url(#soft)"/>
</svg>
