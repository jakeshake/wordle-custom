<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg80" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#0c1226"/>
    </linearGradient>
    <filter id="s80" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="m80" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="t80" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg80)"/>

  <!-- ===== palm tree, cyan, upper left ===== -->
  <g>
    <g fill="none" stroke="#00d9ff" stroke-linecap="round" stroke-linejoin="round">
      <path d="M170,520 L170,280" stroke-width="26" opacity="0.4" filter="url(#s80)"/>
      <path d="M170,520 L170,280" stroke-width="10" opacity="0.7" filter="url(#m80)"/>
      <path d="M170,520 L170,280" stroke-width="4" filter="url(#t80)" stroke="#bdf6ff"/>

      <path d="M170,300 Q90,240 50,170" stroke-width="22" opacity="0.4" filter="url(#s80)"/>
      <path d="M170,300 Q90,240 50,170" stroke-width="9" opacity="0.7" filter="url(#m80)"/>
      <path d="M170,300 Q90,240 50,170" stroke-width="3.5" filter="url(#t80)" stroke="#bdf6ff"/>

      <path d="M170,300 Q250,230 300,160" stroke-width="22" opacity="0.4" filter="url(#s80)"/>
      <path d="M170,300 Q250,230 300,160" stroke-width="9" opacity="0.7" filter="url(#m80)"/>
      <path d="M170,300 Q250,230 300,160" stroke-width="3.5" filter="url(#t80)" stroke="#bdf6ff"/>

      <path d="M170,300 Q140,210 130,120" stroke-width="20" opacity="0.4" filter="url(#s80)"/>
      <path d="M170,300 Q140,210 130,120" stroke-width="8" opacity="0.7" filter="url(#m80)"/>
      <path d="M170,300 Q140,210 130,120" stroke-width="3.2" filter="url(#t80)" stroke="#bdf6ff"/>

      <path d="M170,300 Q210,200 220,110" stroke-width="20" opacity="0.4" filter="url(#s80)"/>
      <path d="M170,300 Q210,200 220,110" stroke-width="8" opacity="0.7" filter="url(#m80)"/>
      <path d="M170,300 Q210,200 220,110" stroke-width="3.2" filter="url(#t80)" stroke="#bdf6ff"/>
    </g>
  </g>

  <!-- ===== flamingo, orange, right side ===== -->
  <g fill="none" stroke="#ff6b00" stroke-linecap="round" stroke-linejoin="round">
    <path d="M760,860 Q820,760 780,660 Q750,590 800,560" stroke-width="26" opacity="0.4" filter="url(#s80)"/>
    <path d="M760,860 Q820,760 780,660 Q750,590 800,560" stroke-width="10" opacity="0.7" filter="url(#m80)"/>
    <path d="M760,860 Q820,760 780,660 Q750,590 800,560" stroke-width="4" filter="url(#t80)" stroke="#ffd9b3"/>

    <circle cx="812" cy="545" r="26" stroke-width="24" opacity="0.4" filter="url(#s80)"/>
    <circle cx="812" cy="545" r="26" stroke-width="9" opacity="0.7" filter="url(#m80)"/>
    <circle cx="812" cy="545" r="26" stroke-width="3.5" filter="url(#t80)" stroke="#ffd9b3"/>

    <path d="M760,860 Q680,900 640,980 Q690,940 720,900" stroke-width="26" opacity="0.35" filter="url(#s80)"/>
    <path d="M760,860 Q680,900 640,980 Q690,940 720,900" stroke-width="10" opacity="0.65" filter="url(#m80)"/>
    <path d="M760,860 Q680,900 640,980 Q690,940 720,900" stroke-width="4" filter="url(#t80)" stroke="#ffd9b3"/>

    <path d="M760,880 L730,1160" stroke-width="18" opacity="0.35" filter="url(#s80)"/>
    <path d="M760,880 L730,1160" stroke-width="7" opacity="0.65" filter="url(#m80)"/>
    <path d="M760,880 L730,1160" stroke-width="3" filter="url(#t80)" stroke="#ffd9b3"/>
  </g>

  <!-- ===== second palm tree, orange, lower left ===== -->
  <g fill="none" stroke="#ff6b00" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240,1560 L240,1340" stroke-width="24" opacity="0.35" filter="url(#s80)"/>
    <path d="M240,1560 L240,1340" stroke-width="9" opacity="0.65" filter="url(#m80)"/>
    <path d="M240,1560 L240,1340" stroke-width="3.5" filter="url(#t80)" stroke="#ffd9b3"/>

    <path d="M240,1360 Q170,1300 130,1240" stroke-width="20" opacity="0.35" filter="url(#s80)"/>
    <path d="M240,1360 Q170,1300 130,1240" stroke-width="8" opacity="0.65" filter="url(#m80)"/>
    <path d="M240,1360 Q170,1300 130,1240" stroke-width="3" filter="url(#t80)" stroke="#ffd9b3"/>

    <path d="M240,1360 Q310,1290 350,1220" stroke-width="20" opacity="0.35" filter="url(#s80)"/>
    <path d="M240,1360 Q310,1290 350,1220" stroke-width="8" opacity="0.65" filter="url(#m80)"/>
    <path d="M240,1360 Q310,1290 350,1220" stroke-width="3" filter="url(#t80)" stroke="#ffd9b3"/>

    <path d="M240,1360 Q200,1270 195,1180" stroke-width="18" opacity="0.35" filter="url(#s80)"/>
    <path d="M240,1360 Q200,1270 195,1180" stroke-width="7" opacity="0.65" filter="url(#m80)"/>
    <path d="M240,1360 Q200,1270 195,1180" stroke-width="2.8" filter="url(#t80)" stroke="#ffd9b3"/>
  </g>

  <!-- ===== stars ===== -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#00d9ff">
      <path d="M560,300 L580,360 L640,380 L580,400 L560,460 L540,400 L480,380 L540,360 Z" stroke-width="14" opacity="0.4" filter="url(#s80)"/>
      <path d="M560,300 L580,360 L640,380 L580,400 L560,460 L540,400 L480,380 L540,360 Z" stroke-width="6" opacity="0.75" filter="url(#m80)"/>
      <path d="M560,300 L580,360 L640,380 L580,400 L560,460 L540,400 L480,380 L540,360 Z" stroke-width="2.4" filter="url(#t80)" stroke="#bdf6ff"/>
    </g>
    <g stroke="#ff6b00">
      <path d="M900,760 L912,800 L952,812 L912,824 L900,864 L888,824 L848,812 L888,800 Z" stroke-width="12" opacity="0.4" filter="url(#s80)"/>
      <path d="M900,760 L912,800 L952,812 L912,824 L900,864 L888,824 L848,812 L888,800 Z" stroke-width="5" opacity="0.75" filter="url(#m80)"/>
      <path d="M900,760 L912,800 L952,812 L912,824 L900,864 L888,824 L848,812 L888,800 Z" stroke-width="2" filter="url(#t80)" stroke="#ffd9b3"/>
    </g>
    <g stroke="#00d9ff">
      <path d="M140,900 L150,932 L182,942 L150,952 L140,984 L130,952 L98,942 L130,932 Z" stroke-width="10" opacity="0.4" filter="url(#s80)"/>
      <path d="M140,900 L150,932 L182,942 L150,952 L140,984 L130,952 L98,942 L130,932 Z" stroke-width="4.5" opacity="0.75" filter="url(#m80)"/>
      <path d="M140,900 L150,932 L182,942 L150,952 L140,984 L130,952 L98,942 L130,932 Z" stroke-width="1.8" filter="url(#t80)" stroke="#bdf6ff"/>
    </g>
  </g>

  <!-- ===== lightning bolts ===== -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#ff6b00">
      <path d="M620,1500 L560,1620 L610,1620 L560,1740 L680,1590 L625,1590 Z" stroke-width="14" opacity="0.4" filter="url(#s80)"/>
      <path d="M620,1500 L560,1620 L610,1620 L560,1740 L680,1590 L625,1590 Z" stroke-width="6" opacity="0.75" filter="url(#m80)"/>
      <path d="M620,1500 L560,1620 L610,1620 L560,1740 L680,1590 L625,1590 Z" stroke-width="2.4" filter="url(#t80)" stroke="#ffd9b3"/>
    </g>
    <g stroke="#00d9ff">
      <path d="M940,1120 L900,1200 L932,1200 L900,1280 L972,1190 L938,1190 Z" stroke-width="12" opacity="0.4" filter="url(#s80)"/>
      <path d="M940,1120 L900,1200 L932,1200 L900,1280 L972,1190 L938,1190 Z" stroke-width="5" opacity="0.75" filter="url(#m80)"/>
      <path d="M940,1120 L900,1200 L932,1200 L900,1280 L972,1190 L938,1190 Z" stroke-width="2" filter="url(#t80)" stroke="#bdf6ff"/>
    </g>
  </g>

  <!-- ===== accent circles (sunset moon nods) ===== -->
  <circle cx="900" cy="1620" r="60" fill="none" stroke="#00d9ff" stroke-width="18" opacity="0.35" filter="url(#s80)"/>
  <circle cx="900" cy="1620" r="60" fill="none" stroke="#00d9ff" stroke-width="7" opacity="0.65" filter="url(#m80)"/>
  <circle cx="900" cy="1620" r="60" fill="none" stroke="#bdf6ff" stroke-width="2.5" filter="url(#t80)"/>

  <!-- floor ambient glow -->
  <rect x="0" y="1870" width="1080" height="50" fill="#ff6b00" opacity="0.12" filter="url(#s80)"/>
</svg>
