<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="citySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08051a"/>
      <stop offset="45%" stop-color="#120b2e"/>
      <stop offset="75%" stop-color="#1c1044"/>
      <stop offset="100%" stop-color="#2a1256"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0722"/>
      <stop offset="100%" stop-color="#1a0f38"/>
    </linearGradient>
    <filter id="glowS" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="glowM" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glowT" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#citySky)"/>

  <!-- stars -->
  <g fill="#bfe9ff" opacity="0.7">
    <circle cx="120" cy="120" r="2.5"/>
    <circle cx="900" cy="180" r="2"/>
    <circle cx="640" cy="80" r="2"/>
    <circle cx="300" cy="220" r="2"/>
    <circle cx="820" cy="320" r="2"/>
    <circle cx="180" cy="360" r="2.5"/>
    <circle cx="500" cy="140" r="1.8"/>
    <circle cx="980" cy="260" r="2"/>
    <circle cx="60" cy="260" r="1.8"/>
  </g>

  <!-- distant hazy skyline block -->
  <g fill="#160f38" opacity="0.85">
    <rect x="-20" y="820" width="1120" height="900"/>
  </g>

  <!-- far buildings -->
  <g fill="#1a1240">
    <rect x="0" y="920" width="130" height="850"/>
    <rect x="140" y="860" width="100" height="910"/>
    <rect x="255" y="960" width="150" height="810"/>
    <rect x="420" y="760" width="120" height="1010"/>
    <rect x="555" y="880" width="140" height="890"/>
    <rect x="710" y="820" width="110" height="950"/>
    <rect x="835" y="940" width="130" height="830"/>
    <rect x="970" y="880" width="110" height="890"/>
  </g>

  <!-- mid buildings, taller, with central tower -->
  <g fill="#100a2c">
    <rect x="-30" y="1120" width="220" height="650"/>
    <rect x="210" y="1040" width="170" height="730"/>
    <rect x="400" y="1220" width="230" height="550"/>
    <rect x="450" y="360" width="150" height="1310"/>
    <rect x="650" y="1100" width="190" height="670"/>
    <rect x="870" y="1180" width="200" height="590"/>
  </g>

  <!-- central tower spire glow -->
  <rect x="510" y="330" width="30" height="60" fill="#00e5ff" opacity="0.8" filter="url(#glowM)"/>
  <line x1="525" y1="240" x2="525" y2="360" stroke="#00e5ff" stroke-width="4" opacity="0.9" filter="url(#glowT)"/>

  <!-- glowing windows, cyan -->
  <g fill="#00e5ff" opacity="0.9">
    <rect x="40" y="1350" width="10" height="16"/>
    <rect x="70" y="1400" width="10" height="16"/>
    <rect x="260" y="1300" width="10" height="16"/>
    <rect x="300" y="1450" width="10" height="16"/>
    <rect x="470" y="1420" width="10" height="16"/>
    <rect x="720" y="1330" width="10" height="16"/>
    <rect x="950" y="1400" width="10" height="16"/>
    <rect x="120" y="1480" width="10" height="16"/>
    <rect x="600" y="1500" width="10" height="16"/>
    <rect x="480" y="500" width="10" height="16"/>
    <rect x="480" y="600" width="10" height="16"/>
    <rect x="480" y="700" width="10" height="16"/>
  </g>
  <!-- glowing windows, magenta/purple -->
  <g fill="#c65bff" opacity="0.9">
    <rect x="100" y="1370" width="10" height="16"/>
    <rect x="340" y="1350" width="10" height="16"/>
    <rect x="500" y="1470" width="10" height="16"/>
    <rect x="760" y="1420" width="10" height="16"/>
    <rect x="980" y="1450" width="10" height="16"/>
    <rect x="230" y="1180" width="10" height="16"/>
    <rect x="900" y="1260" width="10" height="16"/>
  </g>

  <!-- big neon signage panels on buildings -->
  <g>
    <rect x="440" y="1280" width="150" height="46" rx="6" fill="none" stroke="#00e5ff" stroke-width="16" opacity="0.5" filter="url(#glowS)"/>
    <rect x="440" y="1280" width="150" height="46" rx="6" fill="none" stroke="#00e5ff" stroke-width="6" opacity="0.8" filter="url(#glowM)"/>
    <rect x="440" y="1280" width="150" height="46" rx="6" fill="none" stroke="#d8fbff" stroke-width="2" filter="url(#glowT)"/>

    <rect x="720" y="1160" width="120" height="40" rx="6" fill="none" stroke="#ff2ec4" stroke-width="14" opacity="0.5" filter="url(#glowS)"/>
    <rect x="720" y="1160" width="120" height="40" rx="6" fill="none" stroke="#ff2ec4" stroke-width="6" opacity="0.8" filter="url(#glowM)"/>
    <rect x="720" y="1160" width="120" height="40" rx="6" fill="none" stroke="#ffd6f5" stroke-width="2" filter="url(#glowT)"/>

    <circle cx="150" cy="1140" r="46" fill="none" stroke="#8b00ff" stroke-width="14" opacity="0.5" filter="url(#glowS)"/>
    <circle cx="150" cy="1140" r="46" fill="none" stroke="#8b00ff" stroke-width="6" opacity="0.8" filter="url(#glowM)"/>
    <circle cx="150" cy="1140" r="46" fill="none" stroke="#e6ccff" stroke-width="2" filter="url(#glowT)"/>
  </g>

  <!-- vertical neon streaks between buildings -->
  <rect x="524" y="1220" width="6" height="700" fill="#00e5ff" opacity="0.55" filter="url(#glowM)"/>
  <rect x="230" y="1350" width="4" height="570" fill="#c65bff" opacity="0.4" filter="url(#glowM)"/>

  <!-- street level -->
  <rect x="0" y="1720" width="1080" height="200" fill="url(#street)"/>
  <!-- wet street reflections -->
  <g opacity="0.55">
    <rect x="500" y="1740" width="10" height="140" fill="#00e5ff" filter="url(#glowM)"/>
    <rect x="700" y="1760" width="8" height="120" fill="#ff2ec4" filter="url(#glowM)"/>
    <rect x="300" y="1750" width="8" height="130" fill="#8b00ff" filter="url(#glowM)"/>
  </g>
  <rect x="0" y="1720" width="1080" height="4" fill="#00e5ff" opacity="0.4" filter="url(#glowM)"/>

  <!-- ground ambient glow -->
  <rect x="0" y="1880" width="1080" height="40" fill="#00e5ff" opacity="0.18" filter="url(#glowS)"/>
</svg>
