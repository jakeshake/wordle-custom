<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skySW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0221"/>
      <stop offset="40%" stop-color="#1a0b34"/>
      <stop offset="70%" stop-color="#3a1250"/>
      <stop offset="100%" stop-color="#5c1450"/>
    </linearGradient>
    <radialGradient id="sunSW" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff2fb"/>
      <stop offset="35%" stop-color="#ff6ee0"/>
      <stop offset="70%" stop-color="#ff2ec4"/>
      <stop offset="100%" stop-color="#c1157a"/>
    </radialGradient>
    <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2ec4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff2ec4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridFadeSW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00fff0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00fff0" stop-opacity="0"/>
    </linearGradient>
    <filter id="swGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#skySW)"/>

  <!-- stars -->
  <g fill="#e9d6ff" opacity="0.75">
    <circle cx="120" cy="140" r="2.5"/>
    <circle cx="900" cy="200" r="2"/>
    <circle cx="640" cy="90" r="2"/>
    <circle cx="300" cy="240" r="2"/>
    <circle cx="820" cy="360" r="2"/>
    <circle cx="180" cy="300" r="2.5"/>
    <circle cx="960" cy="120" r="2"/>
    <circle cx="60" cy="380" r="1.8"/>
  </g>

  <!-- distant mountain silhouette -->
  <path d="M0,940 L120,820 L240,900 L360,780 L480,880 L600,800 L720,900 L840,820 L960,880 L1080,820 L1080,1000 L0,1000 Z"
        fill="#22093a" opacity="0.9"/>

  <!-- sun -->
  <circle cx="540" cy="1080" r="620" fill="url(#sunHalo)"/>
  <circle cx="540" cy="1080" r="320" fill="url(#sunSW)"/>
  <g fill="#0d0221">
    <rect x="220" y="1150" width="640" height="12"/>
    <rect x="240" y="1188" width="600" height="14"/>
    <rect x="270" y="1230" width="540" height="16"/>
    <rect x="305" y="1276" width="470" height="18"/>
    <rect x="345" y="1326" width="390" height="20"/>
  </g>

  <!-- horizon -->
  <rect x="0" y="1400" width="1080" height="6" fill="#00fff0" opacity="0.9" filter="url(#swGlow)"/>
  <rect x="0" y="1400" width="1080" height="3" fill="#d6fffb"/>

  <!-- perspective grid -->
  <g stroke="url(#gridFadeSW)" stroke-width="3">
    <line x1="540" y1="1400" x2="-500" y2="1920"/>
    <line x1="540" y1="1400" x2="-140" y2="1920"/>
    <line x1="540" y1="1400" x2="220" y2="1920"/>
    <line x1="540" y1="1400" x2="540" y2="1920"/>
    <line x1="540" y1="1400" x2="860" y2="1920"/>
    <line x1="540" y1="1400" x2="1220" y2="1920"/>
    <line x1="540" y1="1400" x2="1580" y2="1920"/>
  </g>
  <g stroke="#00fff0" stroke-width="2" opacity="0.65">
    <line x1="20" y1="1470" x2="1060" y2="1470"/>
    <line x1="-100" y1="1560" x2="1180" y2="1560"/>
    <line x1="-260" y1="1680" x2="1340" y2="1680"/>
    <line x1="-460" y1="1830" x2="1540" y2="1830"/>
  </g>

  <!-- magenta accent glow low in the grid -->
  <rect x="0" y="1870" width="1080" height="50" fill="#ff2ec4" opacity="0.16" filter="url(#swGlow)"/>
</svg>
