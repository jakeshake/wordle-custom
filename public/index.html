<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#121213">
<title>Wordly Games</title>
<script>try{var t=localStorage.getItem("wordly:theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="games.css">
</head>
<body class="game-menu">
<div id="toast-container" class="toast-container" aria-live="polite"></div>

<header class="app-header">
  <div class="header-row title-row">
    <div class="header-side">
      <button id="theme-btn" class="icon-btn" aria-label="Change theme" title="Change theme">&#9681;</button>
    </div>
    <h1 class="app-title">WORDLY</h1>
    <div class="header-side header-side-end">
      <button id="player-btn" class="icon-btn" aria-label="Player profile" title="Player profile">&#128100;</button>
    </div>
  </div>
</header>

<main class="menu-main">
  <p id="menu-greeting" class="menu-greeting">Pick a game</p>

  <a class="game-card" href="/wordly">
    <span class="game-icon icon-wordly" aria-hidden="true">
      <span class="t correct">W</span><span class="t present">O</span><span class="t">R</span><span class="t correct">D</span>
    </span>
    <span class="game-info">
      <span class="game-name">Wordly</span>
      <span class="game-desc">Guess the 5 or 6 letter word.</span>
      <span id="status-wordly" class="game-status"></span>
    </span>
  </a>

  <a class="game-card" href="/bee">
    <span class="game-icon icon-bee" aria-hidden="true">
      <svg viewBox="-60 -54 120 108"><polygon points="50,0 25,43.3 -25,43.3 -50,0 -25,-43.3 25,-43.3"></polygon><text x="0" y="0" dy="0.35em">B</text></svg>
    </span>
    <span class="game-info">
      <span class="game-name">Spelling Bee</span>
      <span class="game-desc">How many words can you make from 7 letters?</span>
      <span id="status-bee" class="game-status"></span>
    </span>
  </a>

  <a class="game-card" href="/boxed">
    <span class="game-icon icon-boxed" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <rect x="18" y="18" width="64" height="64"></rect>
        <polyline points="40,18 82,50 60,82 18,40"></polyline>
        <circle cx="40" cy="18" r="5"></circle><circle cx="60" cy="18" r="5"></circle>
        <circle cx="82" cy="40" r="5"></circle><circle cx="82" cy="60" r="5"></circle>
        <circle cx="40" cy="82" r="5"></circle><circle cx="60" cy="82" r="5"></circle>
        <circle cx="18" cy="40" r="5"></circle><circle cx="18" cy="60" r="5"></circle>
      </svg>
    </span>
    <span class="game-info">
      <span class="game-name">Letter Boxed</span>
      <span class="game-desc">Chain words around the square to use all 12 letters.</span>
      <span id="status-boxed" class="game-status"></span>
    </span>
  </a>

  <p class="menu-foot">New daily puzzles every midnight · each game has its own leaderboard &#127942;</p>
</main>

<script src="common.js"></script>
<script>
(() => {
  const S = Shared;
  S.initShell({ onNameSaved: greet });

  function greet() {
    const name = S.getPlayerName();
    document.getElementById("menu-greeting").textContent = name ? `Hi ${name} — pick a game` : "Pick a game";
  }

  const today = S.todayDateString();
  const set = (id, text, done) => {
    const el = document.getElementById(id);
    el.textContent = text;
    el.classList.toggle("done", !!done);
  };

  // Wordly: summarize both lengths' daily results.
  const wordly = [5, 6]
    .map((len) => {
      const s = S.load(`wordly:daily:${len}:${today}`);
      if (!s || !s.guesses || !s.guesses.length) return null;
      if (!s.over) return `${len}-letter in progress`;
      return s.won ? `${len}-letter ✓ in ${s.guesses.length}` : `${len}-letter ✗`;
    })
    .filter(Boolean);
  set("status-wordly", wordly.length ? `Today: ${wordly.join(" · ")}` : "Today's words are waiting", wordly.length);

  const bee = S.load(`bee:daily:${today}`);
  if (bee && bee.found && bee.found.length) {
    set("status-bee", `Today: ${bee.rank} · ${bee.score} pts · ${bee.found.length} words`, true);
  } else {
    set("status-bee", "Today's hive is waiting");
  }

  const boxed = S.load(`boxed:daily:${today}`);
  if (boxed && boxed.solved) {
    set("status-boxed", `Today: ✓ solved in ${boxed.words.length} words`, true);
  } else if (boxed && boxed.started) {
    set("status-boxed", "Today: in progress", true);
  } else {
    set("status-boxed", "Today's box is waiting");
  }

  greet();
})();
</script>
</body>
</html>
